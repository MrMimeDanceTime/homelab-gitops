# Argo CD manages itself. Chart, release name, and values must match the
# bootstrap that Talos applies (homelab-terraform talos.tf) so Argo adopts
# the running install instead of fighting it. Upgrade Argo CD here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 10.9.6
    helm:
      releaseName: argocd
      valuesObject:
        dex:
          enabled: false
        configs:
          params:
            # TLS terminates at the gateway once one exists; until then,
            # reach the UI with kubectl port-forward.
            server.insecure: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Argo's own CRDs exceed the client-side apply annotation limit.
      - ServerSideApply=true
