# Every ExternalSecret on the cluster reads through this store. It is scoped
# to /apps in k8s-trnk so workloads never see the cluster's own kubeconfig
# and talosconfig, which Terraform publishes at the project root.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical
spec:
  provider:
    infisical:
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-universal-auth
            namespace: external-secrets
            key: clientId
          clientSecret:
            name: infisical-universal-auth
            namespace: external-secrets
            key: clientSecret
      secretsScope:
        projectSlug: k8s-trnk
        environmentSlug: prod
        secretsPath: /apps
